services:
  choretracker:
    build: .
    ports:
      - '3000:3000'
    volumes:
      # SQLite database + uploaded photos persist here. Backup = copy ./data
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/chores.db
      # Max upload size (photo proof).
      - BODY_SIZE_LIMIT=10M
      # Set to your local timezone so chores roll over at YOUR midnight.
      - TZ=America/Los_Angeles
      # ORIGIN is not needed (the app does a same-host CSRF check, so
      # localhost, the LAN IP, and a hostname all work at once).
    restart: unless-stopped
